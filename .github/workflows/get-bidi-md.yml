name: MDN WebDriver Markdown Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Local Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Turndown
      run: npm install turndown

    - name: Clone MDN WebDriver Content (Sparse)
      run: |
        git clone --depth 1 --no-checkout https://github.com/mdn/content.git mdn-source
        cd mdn-source
        git sparse-checkout init --cone
        git sparse-checkout set files/en-us/web/webdriver
        git checkout main

    - name: Fetch Compiled MDN Content and Convert to Markdown
      run: |
            mkdir -p final-compiled-markdown

            cat << 'EOF' > convert.js
            const fs = require('fs');
            const path = require('path');
            const TurndownService = require('turndown');

            const turndownService = new TurndownService({ 
                headingStyle: 'atx', 
                codeBlockStyle: 'fenced' 
            });

            const sourceDir = 'mdn-source/files/en-us/web/webdriver';
            const outputDir = 'final-compiled-markdown';

            async function processDirectory(currentSrc, currentOut) {
                if (!fs.existsSync(currentOut)) {
                    fs.mkdirSync(currentOut, { recursive: true });
                }

                const items = fs.readdirSync(currentSrc);

                for (const item of items) {
                    const srcPath = path.join(currentSrc, item);
                    const outPath = path.join(currentOut, item);

                    if (fs.statSync(srcPath).isDirectory()) {
                        await processDirectory(srcPath, outPath);
                    } else if (item === 'index.md') {
                        const rawContent = fs.readFileSync(srcPath, 'utf8');

                        // Estrazione del Front-Matter YAML
                        const frontMatterMatch = rawContent.match(/^---[\s\S]*?---/);
                        const frontMatter = frontMatterMatch ? frontMatterMatch[0] : '';

                        // Estrazione Slug
                        const slugMatch = rawContent.match(/slug:\s*(.*)/);
                        let slug = slugMatch ? slugMatch[1].trim() : '';

                        if (!slug) {
                            const relPath = path.relative('mdn-source/files/en-us', currentSrc);
                            slug = relPath.split(path.sep).join('/');
                        }

                        // Download index.json da CDN MDN
                        const jsonUrl = `https://developer.mozilla.org/en-US/docs/${slug}/index.json`;
                        
                        try {
                            const res = await fetch(jsonUrl);
                            if (!res.ok) throw new Error(`HTTP ${res.status}`);
                            const jsonData = await res.json();

                            // Estrazione HTML compilato
                            const sections = jsonData.doc.body || [];
                            const compiledHtml = sections
                                .map(s => typeof s.value === 'string' ? s.value : s.value?.content || '')
                                .join('\n');

                            // Conversione HTML -> Markdown
                            const markdownBody = turndownService.turndown(compiledHtml);
                            const finalMarkdown = frontMatter + '\n\n' + markdownBody;

                            fs.writeFileSync(path.join(currentOut, 'index.md'), finalMarkdown, 'utf8');
                            console.log(`Compilato: ${slug}`);
                        } catch (err) {
                            console.error(`Errore per ${slug}: ${err.message}`);
                            // Fallback sul contenuto originale grezzo
                            fs.writeFileSync(path.join(currentOut, 'index.md'), rawContent, 'utf8');
                        }
                    }
                }
            }

            processDirectory(sourceDir, outputDir);
            EOF

            node convert.js

    - name: Compress Markdown Files into ZIP
      run: |
        zip -r mdn-webdriver-compiled-with-frontmatter.zip final-compiled-markdown/

    - name: Generate Release Tag Name
      id: tag
      run: echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: MDN WebDriver Compiled Markdown (${{ steps.tag.outputs.release_tag }})
        body: |
          Compilazione automatizzata della documentazione MDN per WebDriver / BiDi.
          
          - Macro KumaScript espanse via MDN Production CDN (`index.json`).
          - Front-matter originale mantenuto in cima a ciascun file.
        draft: false
        prerelease: false
        files: mdn-webdriver-compiled-with-frontmatter.zip
