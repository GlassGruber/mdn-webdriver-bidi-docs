name: Full bundle MDN WebDriver Markdown 

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Local Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: pip install -r scripts/mdn-convert-requirements.txt

    - name: Clone MDN WebDriver Content (Sparse)
      run: |
        git clone --depth 1 --no-checkout https://github.com/mdn/content.git mdn-source
        cd mdn-source
        git sparse-checkout init --cone
        git sparse-checkout set files/en-us/web/webdriver
        git checkout main

    - name: Process MDN Documentation Bundle
      run: python scripts/mdn-convert.py

    - name: Read Manifest Provenance Data
      id: manifest
      run: |
        SOURCE_REPO=$(jq -r '.source_repository' release_bundle/bundle_manifest.json)
        SOURCE_PATH=$(jq -r '.source_path' release_bundle/bundle_manifest.json)
        SOURCE_URL=$(jq -r '.source_url' release_bundle/bundle_manifest.json)
        SOURCE_COMMIT_URL=$(jq -r '.source_commit_url' release_bundle/bundle_manifest.json)
        COMMIT_HASH=$(jq -r '.source_commit_hash' release_bundle/bundle_manifest.json)
        COMMIT_DATE=$(jq -r '.source_commit_date' release_bundle/bundle_manifest.json)
        TOTAL_FILES=$(jq -r '.total_compiled_files' release_bundle/bundle_manifest.json)
        
        echo "source_repo=$SOURCE_REPO" >> $GITHUB_OUTPUT
        echo "source_path=$SOURCE_PATH" >> $GITHUB_OUTPUT
        echo "source_url=$SOURCE_URL" >> $GITHUB_OUTPUT
        echo "source_commit_url=$SOURCE_COMMIT_URL" >> $GITHUB_OUTPUT
        echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "commit_date=$COMMIT_DATE" >> $GITHUB_OUTPUT
        echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT

    - name: Generate Directory Tree
      id: tree
      run: |
        sudo apt-get update && sudo apt-get install -y tree
        COMPILED_TREE=$(tree release_bundle/compiled_mdn_webdriver/ --noreport)
        
        echo "compiled_tree<<EOF" >> $GITHUB_OUTPUT
        echo "$COMPILED_TREE" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Compress Dual Documentation Bundle into ZIP
      run: |
        zip -r mdn-webdriver-bundle.zip release_bundle/

    - name: Generate Release Tag Name
      id: tag
      run: echo "release_tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Deploy to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: MDN WebDriver Documentation Bundle (${{ steps.tag.outputs.release_tag }})
        body: |
          Automated build of MDN WebDriver/BiDi documentation.

          ### Provenance Metadata
          * **Source Repository**: [mdn/content](${{ steps.manifest.outputs.source_repo }})
          * **Source Path**: [`${{ steps.manifest.outputs.source_path }}`](${{ steps.manifest.outputs.source_url }})
          * **Source Commit URL**: [View Commit Tree](${{ steps.manifest.outputs.source_commit_url }})
          * **Source Commit Hash**: [`${{ steps.manifest.outputs.commit_hash }}`](${{ steps.manifest.outputs.source_repo }}/commit/${{ steps.manifest.outputs.commit_hash }})
          * **Source Commit Date**: `${{ steps.manifest.outputs.commit_date }}`
          * **Total Compiled Files**: `${{ steps.manifest.outputs.total_files }}`

          ### ZIP Archive Contents
          * `bundle_manifest.json`: Machine-readable provenance metadata.
          * `raw_mdn_webdriver/`: Original unmodified MDN Markdown source files.
          * `compiled_mdn_webdriver/`: Processed, flattened, macro-expanded, BCD-injected, and link-normalized Markdown files.

          ### Bundle Directory Structure

          > [!NOTE]
          > The compiled bundle contains ${{ steps.manifest.outputs.total_files }} flattened Markdown documents optimized for LLM context processing.

          <details>
          <summary><b>Click to expand complete file tree</b></summary>

          ```text
          ${{ steps.tree.outputs.compiled_tree }}
          ```

          </details>
        draft: false
        prerelease: false
        files: mdn-webdriver-bundle.zip
